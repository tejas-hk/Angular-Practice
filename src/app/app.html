<h1>{{name}}</h1>
<button (click)="handleClick()">Submit</button>
<input (input)="handleInput($event.target.value)" placeholder="Enter text..." />
<input (keyup)="onKeyUp($event)" placeholder="Type something..." />
<div (mouseover)="onHover()" (mouseout)="onLeave()" class="hover-box">Hover over me!</div>
<input (blur)="onBlur()" (focus)="onFocus()" placeholder="Click outside me..." />
